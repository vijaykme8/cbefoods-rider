<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#8806CE"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CBE Rider">
<title>Coimbatore Foods Rider</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/rider-icon.svg"><link rel="stylesheet" href="styles.css">
</head><body><div class="app-shell"><header class="topbar"><div><p class="eyebrow">Coimbatore Foods</p><h1>Rider Partner</h1><small id="connectionText">Connecting...</small></div><button id="refreshBtn" class="icon-btn">↻</button></header><main>
<section id="loginCard" class="card login-card"><h2>Rider login</h2><p class="muted">Login with your delivery phone number. Admin can assign paid orders to you.</p><div id="phoneScreen"><label>Mobile number<div class="phone-box"><span>+91</span><input id="phoneInput" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210"></div></label><button id="sendOtpBtn" class="btn primary">Send OTP</button><div id="recaptcha-container"></div></div><div id="otpScreen" hidden><button id="backToPhoneBtn" class="text-btn">← Change number</button><label>OTP<input id="otpInput" inputmode="numeric" maxlength="6" placeholder="6 digit OTP"></label><button id="verifyOtpBtn" class="btn primary">Verify OTP</button></div><div id="nameScreen" hidden><label>Your name<input id="riderNameInput" placeholder="Eg: Arun"></label><button id="saveNameBtn" class="btn primary">Start delivery</button></div><div id="notice" class="notice" hidden></div></section>
<section id="riderPanel" hidden><div class="profile-card"><div class="avatar" id="riderInitial">R</div><div><b id="riderNameText">Rider</b><p id="riderPhoneText" class="muted">+91</p></div><button id="onlineBtn" class="btn soft">Go online</button><button id="logoutBtn" class="btn ghost">Logout</button></div><div class="status-card"><span id="gpsText">GPS idle</span><button id="updateGpsBtn" class="btn soft small">Update GPS</button></div><div class="filters"><button class="chip active" data-filter="active">My active</button><button class="chip" data-filter="available">Available</button><button class="chip" data-filter="past">Delivered</button></div><div id="ordersList" class="list"></div></section>
</main></div><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore-compat.js"></script><script src="rider.js"></script></body></html>
